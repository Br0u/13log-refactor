<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photos - 13log</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* 榛樿涓簂ight妯″紡 */
       :root {
        --bg-color: #0f1115;
        --text-color: #f5f7fb;
        --btn-hover: rgba(255, 255, 255, 0.2);
        --glass-bg: rgba(18, 22, 30, 0.58);
        --glass-strong: rgba(24, 30, 40, 0.8);
        --glass-border: rgba(255, 255, 255, 0.28);
        --focus-ring: rgba(120, 180, 255, 0.7);
      }

      /* dark妯″紡瑕嗙洊 */
      body.dark {
        --bg-color: #000;
        --text-color: #ffffff;
        --btn-hover: rgba(255, 255, 255, 0.24);
        --glass-bg: rgba(16, 20, 28, 0.62);
        --glass-strong: rgba(22, 28, 38, 0.86);
        --glass-border: rgba(255, 255, 255, 0.3);
        --focus-ring: rgba(140, 194, 255, 0.8);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: var(--bg-color);
        color: white;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .gallery-container {
        position: relative;
        padding: 10px;
        border: 1px solid var(--glass-border);
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 14px;
        box-shadow: 0 14px 42px rgba(0, 0, 0, 0.35);
      }

      #flip-gallery {
        position: relative;
        width: 300px;
        height: 500px;
        text-align: center;
        perspective: 800px;
      }

      @media (min-width: 600px) {
        #flip-gallery {
          width: 360px;
          height: 600px;
        }
      }

      @media (min-width: 768px) {
        #flip-gallery {
          width: 400px;
          height: 640px;
        }
      }

      #flip-gallery::after {
        content: "";
        position: absolute;
        background-color: black;
        width: 100%;
        height: 4px;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
      }

      #flip-gallery::before {
        content: "";
        display: none;
      }

      #flip-gallery > * {
        position: absolute;
        width: 100%;
        height: 50%;
        overflow: hidden;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
      }

      .top,
      .overlay-top {
        top: 0;
        transform-origin: bottom;
        background-position: top;
      }

      .bottom,
      .overlay-bottom {
        bottom: 0;
        transform-origin: top;
        background-position: bottom;
      }

      .navigation {
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 8px;
        display: flex;
        gap: 8px;
      }

      .nav-button {
        background: var(--glass-strong);
        border: 1px solid var(--glass-border);
        color: #fff;
        cursor: pointer;
        transition: transform 0.2s ease, background-color 0.2s ease,
          opacity 0.2s ease, border-color 0.2s ease;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.95;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      }

      .nav-button:hover {
        opacity: 1;
        background: rgba(42, 52, 68, 0.92);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-1px);
      }

      /* 杩斿洖鎸夐挳 */
      .back-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: var(--glass-strong);
        border: 1px solid var(--glass-border);
        color: #fff;
        padding: 8px 14px;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.2s ease, background-color 0.2s ease,
          border-color 0.2s ease;
        text-decoration: none;
        font-size: 1.05rem;
        line-height: 1;
        z-index: 20;
        opacity: 0.95;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      }

      .back-btn:hover {
        background: rgba(42, 52, 68, 0.92);
        border-color: rgba(255, 255, 255, 0.5);
        opacity: 1;
        transform: translateY(-1px);
      }

      /* 鎵规鍒囨崲鍣?- 鍙粦鍔?*/
      .batch-switcher {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 80px; /* 涓鸿繑鍥炴寜閽暀绌洪棿 */
        z-index: 20;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        padding: 4px 0;
        /* 闅愯棌婊氬姩鏉′絾淇濇寔鍔熻兘 */
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE/Edge */
      }

      .batch-switcher::-webkit-scrollbar {
        display: none; /* Chrome/Safari */
      }

      .batch-switcher-inner {
        display: inline-flex;
        gap: 8px;
        padding: 0 4px;
      }

      .batch-btn {
        background: var(--glass-strong);
        border: 1px solid var(--glass-border);
        color: #fff;
        padding: 7px 12px;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.2s ease, background-color 0.2s ease,
          border-color 0.2s ease, opacity 0.2s ease;
        font-size: 0.82rem;
        font-weight: 600;
        opacity: 0.95;
        white-space: nowrap;
        flex-shrink: 0;
        letter-spacing: 0.02em;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.22);
      }

      .batch-btn.active {
        background: rgba(255, 255, 255, 0.96);
        color: #111827;
        border-color: rgba(255, 255, 255, 1);
        opacity: 1;
      }

      .batch-btn:hover {
        opacity: 1;
        background: rgba(42, 52, 68, 0.92);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-1px);
      }

      /* 婊戝姩鎸囩ず鍣?*/
      .batch-switcher::after {
        content: "";
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 20px;
        background: linear-gradient(to right, transparent, rgba(10, 12, 16, 0.72));
        pointer-events: none;
        opacity: 0.8;
      }

      /* 鎵规淇℃伅鏄剧ず */
      .batch-info {
        position: absolute;
        bottom: 20px;
        left: 20px;
        font-size: 0.8rem;
        opacity: 0.7;
        z-index: 20;
      }
          .nav-button:focus-visible,
      .batch-btn:focus-visible,
      .back-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--focus-ring);
      }
    </style>
  </head>
  <body>
    <!-- 杩斿洖鎸夐挳 -->
    <a href="/" class="back-btn">←</a>

    <!-- 鎵规鍒囨崲鍣?- 鍙粦鍔?-->
    <div class="batch-switcher">
      <div class="batch-switcher-inner"></div>
    </div>

    <!-- 鎵规淇℃伅 -->
    <div class="batch-info" id="batchInfo">Loading...</div>

    <div class="gallery-container">
      <!-- 缈昏浆鐢诲粖 -->
      <div id="flip-gallery" data-title="">
        <div class="top unite"></div>
        <div class="bottom unite"></div>
        <div class="overlay-top unite"></div>
        <div class="overlay-bottom unite"></div>
      </div>

      <!-- 瀵艰埅鎸夐挳 -->
      <div class="navigation">
        <button type="button" class="nav-button" id="prevBtn" title="Previous">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="15,18 9,12 15,6"></polyline>
          </svg>
        </button>
        <button type="button" class="nav-button" id="nextBtn" title="Next">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="9,18 15,12 9,6"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <script>
      let photoBatches = {};
      let batchNames = [];
      let currentBatchIndex = 0;
      let currentBatch = "";
      let images = [];

      async function loadPhotoBatches() {
        const response = await fetch("/api/photos");
        if (!response.ok) {
          throw new Error("Failed to load photos");
        }

        const payload = await response.json();
        const grouped = {};

        (payload.categories || []).forEach((category) => {
          grouped[category.name] = [];
        });

        (payload.photos || []).forEach((photo) => {
          const batchName = photo.category?.name || "Uncategorized";
          if (!grouped[batchName]) {
            grouped[batchName] = [];
          }

          grouped[batchName].push({
            title: photo.title,
            url: photo.imageUrl,
          });
        });

        photoBatches = grouped;
        batchNames = Object.keys(photoBatches).filter((name) => photoBatches[name]?.length);
        currentBatchIndex = 0;
        currentBatch = batchNames[0] || "";
        images = currentBatch ? photoBatches[currentBatch] : [];

        renderBatchButtons();
      }

      function renderBatchButtons() {
        const switcherInner = document.querySelector(".batch-switcher-inner");
        switcherInner.innerHTML = "";

        batchNames.forEach((batchName, index) => {
          const button = document.createElement("button");
          button.className = `batch-btn${index === currentBatchIndex ? " active" : ""}`;
          button.dataset.batch = batchName;
          button.textContent = batchName;
          button.addEventListener("click", () => switchBatch(batchName));
          switcherInner.appendChild(button);
        });
      }

      // 鍒囨崲鎵规
      function switchBatch(batchName) {
        currentBatch = batchName;
        currentBatchIndex = batchNames.indexOf(batchName);
        images = photoBatches[currentBatch];
        currentIndex = 0; // 閲嶇疆鍒扮涓€寮犵収鐗?

        // 娓呴櫎褰撳墠鎵规鐨勫姞杞界姸鎬?
        isLoading = false;

        // 鏇存柊UI
        updateBatchButtons();
        updateBatchInfo();
        defineFirstImg();

        // 鍚姩鏂版壒娆＄殑棰勫姞杞?
        setTimeout(() => startPreloadQueue(), 500);

        console.log(`切换到批次: ${currentBatch} (${images.length}张)`);
      }

      // 鏇存柊鎵规鎸夐挳鐘舵€?
      function updateBatchButtons() {
        document.querySelectorAll(".batch-btn").forEach((btn) => {
          btn.classList.remove("active");
          if (btn.dataset.batch === currentBatch) {
            btn.classList.add("active");
            // 鑷姩婊氬姩鍒版椿鍔ㄦ寜閽?
            scrollToActiveButton(btn);
          }
        });
      }

      // 婊氬姩鍒版椿鍔ㄦ寜閽?
      function scrollToActiveButton(activeBtn) {
        const switcher = document.querySelector(".batch-switcher");
        const btnRect = activeBtn.getBoundingClientRect();
        const switcherRect = switcher.getBoundingClientRect();

        // 璁＄畻闇€瑕佹粴鍔ㄧ殑璺濈
        const scrollLeft =
          activeBtn.offsetLeft -
          switcher.offsetWidth / 2 +
          activeBtn.offsetWidth / 2;

        // 骞虫粦婊氬姩
        switcher.scrollTo({
          left: scrollLeft,
          behavior: "smooth",
        });
      }

      // 璁剧疆鎵规鍒囨崲鍣ㄧ殑瑙︽懜婊戝姩
      function setupBatchSwitcherScroll() {
        const switcher = document.querySelector(".batch-switcher");
        let isDown = false;
        let startX;
        let scrollLeft;

        // 榧犳爣浜嬩欢
        switcher.addEventListener("mousedown", (e) => {
          isDown = true;
          switcher.style.cursor = "grabbing";
          startX = e.pageX - switcher.offsetLeft;
          scrollLeft = switcher.scrollLeft;
        });

        switcher.addEventListener("mouseleave", () => {
          isDown = false;
          switcher.style.cursor = "grab";
        });

        switcher.addEventListener("mouseup", () => {
          isDown = false;
          switcher.style.cursor = "grab";
        });

        switcher.addEventListener("mousemove", (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - switcher.offsetLeft;
          const walk = (x - startX) * 2;
          switcher.scrollLeft = scrollLeft - walk;
        });

        // 瑙︽懜浜嬩欢
        let touchStartX = 0;
        switcher.addEventListener(
          "touchstart",
          (e) => {
            touchStartX = e.touches[0].clientX;
            scrollLeft = switcher.scrollLeft;
          },
          { passive: true }
        );

        switcher.addEventListener(
          "touchmove",
          (e) => {
            const touchX = e.touches[0].clientX;
            const walk = touchStartX - touchX;
            switcher.scrollLeft = scrollLeft + walk;
          },
          { passive: true }
        );

        // 璁剧疆鍒濆鏍峰紡
        switcher.style.cursor = "grab";
      }

      // 鏇存柊鎵规淇℃伅鏄剧ず
      function updateBatchInfo() {
        const info = document.getElementById("batchInfo");
        info.textContent = `${currentBatch} (${currentIndex + 1}/${
          images.length
        })`;
      }

      // 閰嶇疆
      const FLIP_SPEED = 750;
      const flipTiming = { duration: FLIP_SPEED, iterations: 1 };

      // 缈昏浆鍔ㄧ敾鍏抽敭甯?
      const flipAnimationTop = [
        { transform: "rotateX(0)" },
        { transform: "rotateX(-90deg)" },
        { transform: "rotateX(-90deg)" },
      ];
      const flipAnimationBottom = [
        { transform: "rotateX(90deg)" },
        { transform: "rotateX(90deg)" },
        { transform: "rotateX(0)" },
      ];

      // 鍙嶅悜缈昏浆鍔ㄧ敾鍏抽敭甯?
      const flipAnimationTopReverse = [
        { transform: "rotateX(-90deg)" },
        { transform: "rotateX(-90deg)" },
        { transform: "rotateX(0)" },
      ];
      const flipAnimationBottomReverse = [
        { transform: "rotateX(0)" },
        { transform: "rotateX(90deg)" },
        { transform: "rotateX(90deg)" },
      ];

      // 鍏ㄥ眬鍙橀噺
      let currentIndex = 0;
      let container, uniteElements;

      // 鍒濆鍖?
      function init() {
        container = document.getElementById("flip-gallery");
        uniteElements = container.querySelectorAll(".unite");

        defineFirstImg();
        setupEventListeners();
      }

      // 璁剧疆绗竴寮犲浘鐗?
      function defineFirstImg() {
        uniteElements.forEach((el) => setActiveImage(el, currentIndex));
        setImageTitle(currentIndex);
        updateBatchInfo();
      }

      // 鍥剧墖棰勫姞杞界鐞?
      const imageCache = new Map();
      const loadQueue = [];
      let isLoading = false;
      const PRELOAD_COUNT = 10; // 棰勫姞杞芥暟閲?
      const CONCURRENT_LOADS = 3; // 骞跺彂鍔犺浇鏁伴噺

      // 棰勫姞杞藉浘鐗?
      function preloadImage(imageUrl) {
        return new Promise((resolve, reject) => {
          if (imageCache.has(imageUrl)) {
            resolve(imageCache.get(imageUrl));
            return;
          }

          const img = new Image();
          img.onload = () => {
            imageCache.set(imageUrl, imageUrl);
            console.log(`✅ 图片加载完成: ${imageUrl.split("/").pop()}`);
            resolve(imageUrl);
          };
          img.onerror = () => {
            console.warn(`❌ 图片加载失败: ${imageUrl}`);
            reject(new Error(`Failed to load ${imageUrl}`));
          };
          img.src = imageUrl;
        });
      }

      // 鎵归噺棰勫姞杞藉浘鐗囷紙闃熷垪褰㈠紡锛?
      async function batchPreloadImages(imageUrls, startIndex = 0) {
        const toLoad = imageUrls.slice(startIndex, startIndex + PRELOAD_COUNT);
        console.log(
          `馃攧 寮€濮嬮鍔犺浇 ${toLoad.length} 寮犲浘鐗?(${startIndex + 1}-${
            startIndex + toLoad.length
          })`
        );

        // 鍒嗘壒骞跺彂鍔犺浇
        for (let i = 0; i < toLoad.length; i += CONCURRENT_LOADS) {
          const batch = toLoad.slice(i, i + CONCURRENT_LOADS);
          const promises = batch.map((url) =>
            preloadImage(url).catch((err) => console.warn("预加载失败", err))
          );
          await Promise.allSettled(promises);
        }

        console.log(
          `🎀 预加载完成 ${startIndex + 1}-${startIndex + toLoad.length}`
        );
      }

      // 鍚姩棰勫姞杞介槦鍒?
      function startPreloadQueue() {
        if (isLoading) return;
        isLoading = true;

        const allImages = images.map((img) => img.url);

        // 鍏堥鍔犺浇鍓?0寮?
        batchPreloadImages(allImages, 0).then(() => {
          // 濡傛灉鍥剧墖鎬绘暟瓒呰繃10寮狅紝缁х画鍔犺浇鍓╀綑鐨?
          if (allImages.length > PRELOAD_COUNT) {
            setTimeout(() => {
              batchPreloadImages(allImages, PRELOAD_COUNT).then(() => {
                // 濡傛灉杩樻湁鏇村锛岀户缁姞杞?
                if (allImages.length > PRELOAD_COUNT * 2) {
                  setTimeout(() => {
                    batchPreloadImages(allImages, PRELOAD_COUNT * 2);
                  }, 2000);
                }
              });
            }, 1000);
          }
          isLoading = false;
        });
      }

      // 璁剧疆娲诲姩鍥剧墖锛堜紭鍖栫増鏈?- 鏀寔棰勫姞杞斤級
      function setActiveImage(el, index = currentIndex) {
        const imageUrl = images[index].url;

        if (imageCache.has(imageUrl)) {
          // 鍥剧墖宸查鍔犺浇锛岀珛鍗虫樉绀?
          el.style.backgroundImage = `url('${imageUrl}')`;
        } else {
          // 鍥剧墖鏈姞杞斤紝鏄剧ず鍔犺浇鐘舵€佸苟寮傛鍔犺浇
          el.style.backgroundColor = "rgba(128, 128, 128, 0.2)";

          preloadImage(imageUrl)
            .then(() => {
              // 纭繚浠嶇劧鏄綋鍓嶅浘鐗囨墠鏇存柊
              if (images[index].url === imageUrl) {
                el.style.backgroundImage = `url('${imageUrl}')`;
                el.style.backgroundColor = "transparent";
              }
            })
            .catch((err) => {
              console.error("图片加载失败:", err);
              el.style.backgroundColor = "rgba(255, 0, 0, 0.1)"; // 绾㈣壊琛ㄧず鍔犺浇澶辫触
            });
        }
      }

      function setImageTitle(index = currentIndex) {
        container.setAttribute("data-title", images[index].title);
        container.style.setProperty("--title-y", "0");
        container.style.setProperty("--title-opacity", "1");
      }

      // 鏇存柊鐢诲粖
      function updateGallery(nextIndex, isReverse = false) {
        // 纭畾鍔ㄧ敾鏂瑰悜
        const topAnim = isReverse ? flipAnimationTopReverse : flipAnimationTop;
        const bottomAnim = isReverse
          ? flipAnimationBottomReverse
          : flipAnimationBottom;

        // 鎵ц缈昏浆鍔ㄧ敾
        container.querySelector(".overlay-top").animate(topAnim, flipTiming);
        container
          .querySelector(".overlay-bottom")
          .animate(bottomAnim, flipTiming);

        container.style.setProperty("--title-y", "-1rem");
        container.style.setProperty("--title-opacity", "0");
        container.setAttribute("data-title", "");

        // 鏇存柊鍥剧墖锛堝甫寤惰繜浠ヤ繚鎸佸姩鐢昏繛缁€э級
        uniteElements.forEach((el, idx) => {
          const delay =
            (isReverse && idx !== 1 && idx !== 2) ||
            (!isReverse && (idx === 1 || idx === 2))
              ? FLIP_SPEED - 200
              : 0;

          setTimeout(() => setActiveImage(el, nextIndex), delay);
        });

        setTimeout(() => setImageTitle(nextIndex), FLIP_SPEED * 0.5);
      }

      // 鏇存柊绱㈠紩
      function updateIndex(increment) {
        const inc = Number(increment);
        const newIndex = (currentIndex + inc + images.length) % images.length;
        const isReverse = inc < 0;
        currentIndex = newIndex;
        updateGallery(newIndex, isReverse);
        updateBatchInfo(); // 鏇存柊鎵规淇℃伅
      }

      // 璁剧疆浜嬩欢鐩戝惉鍣?
      function setupEventListeners() {
        // 鐓х墖瀵艰埅
        document
          .getElementById("prevBtn")
          .addEventListener("click", () => updateIndex(-1));
        document
          .getElementById("nextBtn")
          .addEventListener("click", () => updateIndex(1));

        // 鎵规鍒囨崲
        document.querySelectorAll(".batch-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            switchBatch(btn.dataset.batch);
          });
        });

        // 閿洏瀵艰埅
        document.addEventListener("keydown", (e) => {
          if (e.key === "ArrowLeft") updateIndex(-1);
          if (e.key === "ArrowRight") updateIndex(1);
        });

        // 瑙︽懜鎵嬪娍鏀寔
        let touchStartX = 0;
        container.addEventListener("touchstart", (e) => {
          touchStartX = e.touches[0].clientX;
        });

        container.addEventListener("touchend", (e) => {
          const touchEndX = e.changedTouches[0].clientX;
          const diff = touchStartX - touchEndX;

          if (Math.abs(diff) > 50) {
            // 鏈€灏忔粦鍔ㄨ窛绂?
            if (diff > 0) {
              updateIndex(1); // 鍚戝乏婊戝姩锛屼笅涓€寮?
            } else {
              updateIndex(-1); // 鍚戝彸婊戝姩锛屼笂涓€寮?
            }
          }
        });
      }

      // 绠€鍗曠殑涓婚璺熼殢鍔熻兘
      function setupThemeFollow() {
        // 妫€鏌ユ湰鍦板瓨鍌ㄧ殑涓婚鍋忓ソ锛堜笌涓荤珯鍚屾锛?
        const savedTheme = localStorage.getItem("pref-theme");
        const systemPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;

        // 搴旂敤涓婚锛堜笌PaperMod閫昏緫涓€鑷达級
        if (savedTheme === "dark") {
          document.body.classList.add("dark");
        } else if (savedTheme === "light") {
          document.body.classList.remove("dark");
        } else if (systemPrefersDark) {
          document.body.classList.add("dark");
        }

        console.log(
          "馃摳 Photos椤甸潰涓婚宸插悓姝?",
          savedTheme || (systemPrefersDark ? "dark" : "light")
        );
      }

      // 椤甸潰鍔犺浇瀹屾垚鍚庡垵濮嬪寲
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          await loadPhotoBatches();
          if (!batchNames.length) {
            document.getElementById("batchInfo").textContent = "No photos";
            return;
          }

          init();
          setupThemeFollow();
          setupBatchSwitcherScroll(); // 璁剧疆鎵规鍒囨崲鍣ㄦ粦鍔?

          // 鍚姩棰勫姞杞介槦鍒?
          setTimeout(() => {
            console.log("🚀 启动图片预加载队列...");
            startPreloadQueue();
          }, 500);
        } catch (error) {
          console.error("Failed to load photo batches", error);
          document.getElementById("batchInfo").textContent = "Failed to load photos";
        }
      });
    </script>
  </body>
</html>
